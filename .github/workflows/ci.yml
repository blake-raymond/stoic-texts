name: corpus

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Counts match the texts
        run: python scripts/count_tokens.py --check
      - name: Function tags match the heuristic
        run: python scripts/tag_passages.py --check
      - name: Old Counsel prompt matches the texts
        run: python scripts/build_prompt.py --check
      - name: Assemble the system prompt for the Worker
        run: python scripts/build_prompt.py
      - name: Corpus tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Site check, tests, and chat bundle
        working-directory: site
        run: npm ci && npm test && npm run check && npm run build:web
