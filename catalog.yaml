  - id: cleomedes.caelestia
    author: Cleomedes
    title: On the Heavens
    tier: optional
    reason: >
      The first complete English translation is Alan C. Bowen and Robert B.
      Todd, Cleomedes' Lectures on Astronomy (University of California Press,
      2004), which is in copyright. No earlier complete English translation
      was found at Project Gutenberg, Wikisource, or Perseus. Cleomedes was
      optional and is omitted.

  - id: early_stoic.fragments
    author: Early Stoics
    title: Collected fragments (Zeno, Cleanthes, Chrysippus, and others)
    tier: foundations
    reason: >
      There is no public-domain English collection of the early Stoic
      fragments. Von Arnim's Stoicorum Veterum Fragmenta is Greek and Latin.
      A. A. Long and D. N. Sedley, The Hellenistic Philosophers (1987), and
      Brad Inwood and Lloyd P. Gerson's Stoic sourcebooks are in copyright.
      Early Stoic doctrine is present in this corpus only where a public-domain
      translation already contains it: Diogenes Laertius book 7, Cicero's
      On Ends book 3, On Duties, and On the Nature of the Gods book 2, and
      Cleanthes' Hymn to Zeus. Those works are not a substitute for a fragment
      collection.

  - id: cicero.de_fato
    author: Cicero
    title: On Fate
    tier: foundations
    reason: >
      C. D. Yonge's public-domain translation is in The Treatises of M. T.
      Cicero (Bohn, 1853, with later printings), but the copies located are
      page scans. No clean Project Gutenberg, Wikisource, or Standard Ebooks
      transcription was found, and this corpus does not ship OCR. Stoic
      arguments about fate are still present in On the Nature of the Gods
      book 2, On Ends book 3, and Diogenes Laertius book 7.
