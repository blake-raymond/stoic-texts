# Bibliographic source for the corpus. Word and token counts are not stored
# here. scripts/count_tokens.py writes them to manifest.json and the README.
schema_version: 1
works:
  - id: marcus.meditations
    author: Marcus Aurelius
    title: Meditations
    translator: George Long
    year: 1862
    source: https://standardebooks.org/ebooks/marcus-aurelius/meditations/george-long
    tier: core
    files:
      - texts/marcus-aurelius/meditations/book-*.md
    numbering: >
      Paragraph numbers in this transcription of Long, not the traditional
      section numbers. Several books therefore have a different count from
      the usual sections; book 4 has 54 paragraphs. Books 1 and 2 end with a
      place-note, marcus.meditations.1.place and marcus.meditations.2.place.
    license_basis: >
      George Long's translation was published in 1862. In the United States
      every work published in 1930 or earlier is in the public domain. Long
      died in 1879, so in Canada the life-plus-50 term had expired long before
      the 30 December 2022 extension to life-plus-70, and the copyright was
      not revived. The Standard Ebooks transcription and markup are dedicated
      to the public domain under CC0. This is Long's translation, not Meric
      Casaubon's. Introductions and notes are not included.

