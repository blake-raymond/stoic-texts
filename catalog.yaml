  - id: musonius.rufus
    author: Musonius Rufus
    title: Lectures and Fragments
    translator: Blake Raymond
    year: 2026
    source: https://archive.org/details/cmusoniirufirel00hensgoog
    tier: core
    files:
      - texts/musonius-rufus/lectures/lecture-*.md
      - texts/musonius-rufus/fragments/fragments.md
    numbering: >
      Hense's 1905 numbering, also used by Lutz. Lectures I-XXI are
      musonius.rufus.N, with the split discourses as 13a, 13b, 15a, 15b,
      18a, and 18b. Fragments XXII-LIII are musonius.rufus.22 through
      musonius.rufus.53 in one file. One file per lecture. The spurious
      Letter to Pancratides and the four letters in Philostratus are
      omitted.
    license_basis: >
      Translated by Blake Raymond from Otto Hense, C. Musonii Rufi
      Reliquiae (Teubner, Leipzig, 1905). Hense died in 1931, so the
      Greek edition is in the public domain in the United States and in
      Canada. Blake Raymond wrote this English translation and releases
      it to the public domain under CC0. This is not the Lutz (1947) or
      King (2011) translation. Hense's Latin preface, testimonia,
      critical apparatus, and notes are not included.
