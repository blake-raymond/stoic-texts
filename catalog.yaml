  - id: epictetus.fragments
    author: Epictetus
    title: Fragments
    translator: George Long
    year: 1877
    source: https://en.wikisource.org/wiki/The_Discourses_of_Epictetus;_with_the_Encheiridion_and_Fragments/Fragments
    tier: core
    files:
      - texts/epictetus/fragments/fragments.md
    numbering: >
      Long's fragment numbers. Fragments 179, 180, and 181 are omitted because
