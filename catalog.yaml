  - id: seneca.naturales_quaestiones
    author: Seneca
    title: Natural Questions
    translator: John Clarke
    year: 1910
    source: https://www.gutenberg.org/ebooks/76392
    tier: optional
    files:
      - texts/seneca/natural-questions/book-*.md
    numbering: >
      Clarke's own books and chapters. Ids are
      seneca.naturales_quaestiones.B.C, plus a preface passage where Clarke
      printed one (books 1, 3, and 4). His book 4 is the book later editions
      divide into IVA and IVB; this corpus keeps Clarke's book, not that
      later split. Chapter counts are 17, 59, 30, 13, 18, 32, and 32.
    license_basis: >
      John Clarke's translation was published in 1910, before the 1930 United
      States public-domain cutoff. The translator is identified as John Clarke,
      Lecturer in Education at Aberdeen, born in 1853 or 1854 and died in 1939.
      That identification matches the 1910 title page to a family genealogy;
      it is a judgment call, not a national-biography entry. On that death
      date, the Canadian life-plus-50 term expired at the end of 1989, before
      the 30 December 2022 extension to life-plus-70, and the copyright was
      not revived. Taken from Project Gutenberg ebook 76392. The Gutenberg
      header, footer, and trademark language were removed, as were Archibald
      Geikie's notes, Clarke's own notes, the index, running heads, marginal
      section numbers, and bracketed note markers. Included only as an
      optional physics text.

