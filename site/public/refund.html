<body data-refund="__REFUND_READY__">
<header class="top"><div class="wrap"><a class="mark" href="/">Old Counsel</a></div></header>
<main>
<section class="hero thanks"><div class="wrap">
  <h1>Get a refund</h1>
  <div id="ready" hidden>
    <p class="lede">Enter the email from your purchase.</p>
    <form id="ask" class="refund-form">
      <label class="sr" for="email">Email</label>
      <input class="field" id="email" name="email" type="email" autocomplete="email" required>
      <button class="cta" type="submit">Send a code</button>
    </form>
    <p id="ask-note" hidden></p>
    <form id="confirm" class="refund-form" hidden>
      <label class="sr" for="code">Code</label>
      <input class="field" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required>
      <button class="cta" type="submit">Refund</button>
    </form>
    <p id="done" hidden></p>
  </div>
  <div id="closed">
    <p class="lede">Email <a href="mailto:help@oldcounsel.com">help@oldcounsel.com</a> and you'll be refunded in full.</p>
  </div>
</div></section>
</main>
<footer><div class="wrap">Old Counsel · <a href="https://github.com/blake-raymond/stoiclm">Open source</a> · <a href="https://x.com/oldcounselai">@oldcounselai</a></div></footer>
<script src="/refund.js"></script>
</body>
</html>
